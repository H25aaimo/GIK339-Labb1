<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Labb JavaScript</title>
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Labb JavaScript</h1>
    <p>Öppna konsolen i webbläsaren (F12) för att se output.</p>

    <!--
    Reflektion uppgift 1:

    Script-taggens placering:
    Webbläsaren läser HTML-filen uppifrån och ned.
    Om script-taggen ligger i head utan defer körs JavaScript
    innan resten av HTML-sidan har lästs klart.
    Om man istället placerar script-taggen längst ner i body
    har HTML-innehållet redan lästs in när skriptet körs.

    Attributet defer:
    Defer gör att JavaScript-filen laddas samtidigt som
    webbläsaren läser HTML-dokumentet.
    Skriptet körs först när HTML-dokumentet har lästs klart.
    Därför kan script-taggen ligga i head utan problem.
    -->
  </body>
</html>
